<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Tracker avec Fond YouTube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Conteneur de la vidéo en arrière-plan */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none; /* Empêche de cliquer sur la vidéo */
      overflow: hidden;
    }

    .video-background iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* Ratio 16:9 */
      min-height: 100vh;
      min-width: 177.77vh; /* Ratio 16:9 */
      transform: translate(-50%, -50%);
    }

    /* Calque sombre par-dessus la vidéo pour lire le texte facilement */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.75); /* Ajuste l'opacité selon tes goûts */
      backdrop-filter: blur(3px); /* Optionnel : floute légèrement la vidéo */
      z-index: -1;
    }

    /* Contenu de ton site */
    .content {
      position: relative;
      z-index: 1;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Arrière-plan Vidéo YouTube -->
  <div class="video-background">
    <!-- Remplace VIDEO_ID par l'identifiant de ta vidéo YouTube (ex: dQw4w9WgXcQ) -->
    <iframe 
      src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=VIDEO_ID&controls=0&showinfo=0&autohide=1&modestbranding=1" 
      frameborder="0" 
      allow="autoplay; encrypted-media" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Filtre sombre pour la lisibilité -->
  <div class="overlay"></div>

  <!-- Contenu du site -->
  <div class="content">
    <h1>Geometry Dash Tracker</h1>
    <p>Ton contenu s'affiche par-dessus la vidéo !</p>
  </div>

</body>
</html>
